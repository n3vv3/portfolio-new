<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 548" role="img" aria-labelledby="title desc">
  <title id="title">Card-sorting task</title>
  <desc id="desc">A close visual recreation of the supplied card-sorting screen: a Categories sidebar with a new-category prompt and a Vehicles group, instructions above a grid of remaining cards, and Add to category and Save and continue buttons.</desc>
  <rect x="1" y="1" width="1198" height="546" rx="20" fill="#fff" stroke="#e8e8e8" stroke-width="2"/>


  <rect x="44" y="92" width="300" height="410" rx="16" fill="#fff" stroke="#ededed" stroke-width="2"/>
  <text x="64" y="137" fill="#242424" font-family="DM Sans, Arial, sans-serif" font-size="17" font-weight="700">Categories</text>
  <rect x="64" y="153" width="260" height="104" rx="12" fill="#f8f8f8" stroke="#e5e5e5" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="87" y="190" fill="#2679d8" font-family="DM Sans, Arial, sans-serif" font-size="17" font-weight="600">＋ New category</text>
  <text x="86" y="217" fill="#888" font-family="DM Sans, Arial, sans-serif" font-size="13">Drag and drop or click to create new</text>
  <text x="161" y="237" fill="#888" font-family="DM Sans, Arial, sans-serif" font-size="13">category</text>

  <rect x="64" y="267" width="260" height="164" rx="12" fill="#fff" stroke="#e9e9e9" stroke-width="2"/>
  <text x="82" y="304" fill="#292929" font-family="DM Sans, Arial, sans-serif" font-size="17" font-weight="600">Vehicles</text>
  <rect x="82" y="326" width="224" height="48" rx="8" fill="#fafafa" stroke="#e4e4e4" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="278" y="384" width="30" height="30" rx="8" fill="#eef6ff"/>
  <path d="M293 392v14m-7-7h14" fill="none" stroke="#2580e8" stroke-width="2" stroke-linecap="round"/>

  <rect x="360" y="92" width="796" height="410" rx="16" fill="#fff" stroke="#ededed" stroke-width="2"/>
  <text x="391" y="145" fill="#292929" font-family="DM Sans, Arial, sans-serif" font-size="17" font-weight="600">In this exercise, you'll create and name your own groups and sort the cards into them.</text>
  <text x="391" y="174" fill="#292929" font-family="DM Sans, Arial, sans-serif" font-size="17">There are no right or wrong answers - just organize them in a way that makes sense to</text>
  <text x="391" y="203" fill="#292929" font-family="DM Sans, Arial, sans-serif" font-size="17">you.</text>
  <line x1="361" y1="238" x2="1155" y2="238" stroke="#e8e8e8" stroke-width="2"/>
  <text x="391" y="280" fill="#292929" font-family="DM Sans, Arial, sans-serif" font-size="17" font-weight="600">Cards</text>
  <text x="1128" y="280" fill="#888" font-family="DM Sans, Arial, sans-serif" font-size="14" text-anchor="end">32 cards remaining</text>

  <g font-family="DM Sans, Arial, sans-serif" font-size="15" fill="#555">
    <g><rect x="391" y="296" width="238" height="48" rx="9" fill="#fff" stroke="#e6e6e6" stroke-width="2"/><rect x="405" y="310" width="18" height="18" rx="4" fill="none" stroke="#bcbcbc" stroke-width="2"/><text x="438" y="326">About us</text></g>
    <g><rect x="635" y="296" width="238" height="48" rx="9" fill="#fff" stroke="#e6e6e6" stroke-width="2"/><rect x="649" y="310" width="18" height="18" rx="4" fill="none" stroke="#bcbcbc" stroke-width="2"/><text x="682" y="326">Fleet &amp; business</text></g>
    <g><rect x="879" y="296" width="238" height="48" rx="9" fill="#fff" stroke="#e6e6e6" stroke-width="2"/><rect x="893" y="310" width="18" height="18" rx="4" fill="none" stroke="#bcbcbc" stroke-width="2"/><text x="926" y="326">Sustainability</text></g>
    <g><rect x="391" y="354" width="238" height="48" rx="9" fill="#fff" stroke="#e6e6e6" stroke-width="2"/><rect x="405" y="368" width="18" height="18" rx="4" fill="none" stroke="#bcbcbc" stroke-width="2"/><text x="438" y="384">Accessories</text></g>
    <g><rect x="635" y="354" width="238" height="48" rx="9" fill="#fff" stroke="#e6e6e6" stroke-width="2"/><rect x="649" y="368" width="18" height="18" rx="4" fill="none" stroke="#bcbcbc" stroke-width="2"/><text x="682" y="384">Safety</text></g>
    <g><rect x="879" y="354" width="238" height="48" rx="9" fill="#fff" stroke="#e6e6e6" stroke-width="2"/><rect x="893" y="368" width="18" height="18" rx="4" fill="none" stroke="#bcbcbc" stroke-width="2"/><text x="926" y="384">Sedan</text></g>
  </g>
  <rect x="360" y="414" width="796" height="88" rx="0" fill="#fff" stroke="#ededed" stroke-width="2"/>
  <rect x="806" y="444" width="154" height="40" rx="10" fill="#fff" stroke="#e4e4e4" stroke-width="2"/>
  <text x="883" y="469" fill="#d0d0d0" font-family="DM Sans, Arial, sans-serif" font-size="13" text-anchor="middle">Add to category</text>
  <rect x="972" y="444" width="154" height="40" rx="10" fill="#d2d2d2"/>
  <text x="1049" y="469" fill="#fff" font-family="DM Sans, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Save &amp; continue</text>
</svg>
